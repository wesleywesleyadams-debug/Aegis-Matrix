<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#060b12"/>
      <stop offset="35%" stop-color="#0d1f2c"/>
      <stop offset="62%" stop-color="#173445"/>
      <stop offset="100%" stop-color="#0a1512"/>
    </linearGradient>

    <radialGradient id="shaft" cx="50%" cy="8%" r="65%">
      <stop offset="0%" stop-color="#bfe9f2" stop-opacity="0.55"/>
      <stop offset="35%" stop-color="#6fb2c4" stop-opacity="0.28"/>
      <stop offset="70%" stop-color="#2c5568" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0a1512" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="mist" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#274a52" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#274a52" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="cliffL" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0%" stop-color="#0a140d"/>
      <stop offset="100%" stop-color="#16281a"/>
    </linearGradient>
    <linearGradient id="cliffR" x1="1" y1="0" x2="0" y2="0.4">
      <stop offset="0%" stop-color="#0a140d"/>
      <stop offset="100%" stop-color="#16281a"/>
    </linearGradient>

    <linearGradient id="fall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dff3f8" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#a9d6e0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a9d6e0" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="vignette" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#040608" stop-opacity="0"/>
      <stop offset="62%" stop-color="#040608" stop-opacity="0"/>
      <stop offset="100%" stop-color="#020304" stop-opacity="0.75"/>
    </radialGradient>

    <radialGradient id="ui_dim" cx="50%" cy="47%" r="42%">
      <stop offset="0%" stop-color="#01050a" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#01050a" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#01050a" stop-opacity="0"/>
    </radialGradient>

    <g id="tree" fill="none" stroke="#03070a" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0,760 C14,650 -22,580 6,490 C28,420 -16,380 12,290" stroke-width="30"/>
      <path d="M12,290 C28,220 -12,200 16,110 C28,60 4,20 22,-40" stroke-width="17"/>
      <path d="M6,490 C64,455 96,395 150,372" stroke-width="15"/>
      <path d="M150,372 C182,350 204,306 236,294" stroke-width="8"/>
      <path d="M0,420 C-54,398 -86,342 -138,330" stroke-width="13"/>
      <path d="M-138,330 C-170,318 -202,284 -234,272" stroke-width="7"/>
      <path d="M16,230 C64,208 86,164 128,142" stroke-width="10"/>
      <path d="M16,230 C-32,208 -54,164 -96,152" stroke-width="10"/>
      <path d="M22,80 C54,58 66,26 98,4" stroke-width="6"/>
      <path d="M22,80 C-10,58 -22,26 -54,10" stroke-width="6"/>
      <path d="M-138,330 C-150,290 -128,260 -152,220" stroke-width="6"/>
    </g>

    <g id="flowers">
      <ellipse cx="0" cy="0" rx="7" ry="5" fill="#b48ce0" opacity="0.9"/>
      <ellipse cx="16" cy="6" rx="6" ry="4" fill="#c9a2ec" opacity="0.85"/>
      <ellipse cx="-14" cy="8" rx="5" ry="4" fill="#9a6fce" opacity="0.85"/>
      <ellipse cx="6" cy="16" rx="6" ry="4" fill="#d8b6f2" opacity="0.8"/>
      <ellipse cx="-20" cy="18" rx="5" ry="3" fill="#b48ce0" opacity="0.75"/>
      <ellipse cx="24" cy="20" rx="5" ry="3" fill="#c9a2ec" opacity="0.75"/>
      <ellipse cx="-4" cy="26" rx="6" ry="4" fill="#9a6fce" opacity="0.7"/>
    </g>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="1080" fill="url(#shaft)"/>

  <!-- hazy background tree canopy -->
  <g opacity="0.38" stroke="#254a5c">
    <use href="#tree" transform="translate(140,120) scale(1.7,1.3) rotate(6)"/>
    <use href="#tree" transform="translate(520,60) scale(1.4,1.1) rotate(-4)"/>
    <use href="#tree" transform="translate(960,-10) scale(1.6,1.2)"/>
    <use href="#tree" transform="translate(1400,50) scale(1.4,1.1) rotate(5)"/>
    <use href="#tree" transform="translate(1800,110) scale(1.7,1.3) rotate(-6)"/>
  </g>

  <!-- mid canopy -->
  <g opacity="0.62" stroke="#0e222c">
    <use href="#tree" transform="translate(40,260) scale(1.5,1.25) rotate(4)"/>
    <use href="#tree" transform="translate(700,190) scale(1.3,1.05) rotate(-3)"/>
    <use href="#tree" transform="translate(1220,190) scale(1.3,1.05) rotate(3)"/>
    <use href="#tree" transform="translate(1880,260) scale(1.5,1.25) rotate(-4)"/>
  </g>

  <!-- foreground trunks framing the canyon -->
  <g opacity="0.96">
    <use href="#tree" transform="translate(-40,760) scale(1.9,1.5) rotate(3)"/>
    <use href="#tree" transform="translate(210,820) scale(1.5,1.35) rotate(-5)"/>
    <use href="#tree" transform="translate(1720,820) scale(-1.5,1.35) rotate(5)"/>
    <use href="#tree" transform="translate(1960,760) scale(-1.9,1.5) rotate(-3)"/>
  </g>

  <!-- canyon floor mist -->
  <rect x="700" y="700" width="520" height="380" fill="url(#mist)"/>

  <!-- mossy cliffs -->
  <path d="M0,1080 L0,560 C120,540 180,600 260,560 C360,510 380,600 460,610 C560,624 600,700 700,760 C760,800 780,900 760,1080 Z" fill="url(#cliffL)"/>
  <path d="M1920,1080 L1920,560 C1800,540 1740,600 1660,560 C1560,510 1540,600 1460,610 C1360,624 1320,700 1220,760 C1160,800 1140,900 1160,1080 Z" fill="url(#cliffR)"/>

  <!-- waterfalls -->
  <path d="M300,560 C310,650 290,700 300,800 C306,880 292,960 300,1080" stroke="url(#fall)" stroke-width="22" fill="none" opacity="0.8"/>
  <path d="M470,600 C480,680 462,740 470,830 C476,900 464,980 470,1080" stroke="url(#fall)" stroke-width="14" fill="none" opacity="0.7"/>
  <path d="M1620,560 C1610,650 1630,700 1620,800 C1614,880 1628,960 1620,1080" stroke="url(#fall)" stroke-width="22" fill="none" opacity="0.8"/>
  <path d="M1450,600 C1440,680 1458,740 1450,830 C1444,900 1456,980 1450,1080" stroke="url(#fall)" stroke-width="14" fill="none" opacity="0.7"/>

  <!-- moss highlights -->
  <ellipse cx="220" cy="600" rx="90" ry="30" fill="#2f4d2a" opacity="0.5"/>
  <ellipse cx="560" cy="640" rx="110" ry="26" fill="#345424" opacity="0.45"/>
  <ellipse cx="1700" cy="600" rx="90" ry="30" fill="#2f4d2a" opacity="0.5"/>
  <ellipse cx="1360" cy="640" rx="110" ry="26" fill="#345424" opacity="0.45"/>

  <!-- flower drifts along the cliff edges -->
  <use href="#flowers" transform="translate(150,580) scale(1.4)"/>
  <use href="#flowers" transform="translate(280,610) scale(1.1)"/>
  <use href="#flowers" transform="translate(420,650) scale(1.3)"/>
  <use href="#flowers" transform="translate(60,700) scale(1.2)"/>
  <use href="#flowers" transform="translate(340,760) scale(1.0)"/>
  <use href="#flowers" transform="translate(1770,580) scale(1.4)"/>
  <use href="#flowers" transform="translate(1640,610) scale(1.1)"/>
  <use href="#flowers" transform="translate(1500,650) scale(1.3)"/>
  <use href="#flowers" transform="translate(1860,700) scale(1.2)"/>
  <use href="#flowers" transform="translate(1580,760) scale(1.0)"/>

  <rect width="1920" height="1080" fill="url(#vignette)"/>
  <rect width="1920" height="1080" fill="url(#ui_dim)"/>
</svg>
